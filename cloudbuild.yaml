
steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-build-repo/helloworld-image:v3'
      - '.'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-build-repo/helloworld-image:v3'

  # Step 3: Deploy image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cloud-console-app'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-build-repo/helloworld-image:v3'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-build-repo/helloworld-image:v3'

tags:
  - 'gcp-cloud-build-sample-build'

options:
  logging: CLOUD_LOGGING_ONLY
  pubsubTopic: 'projects/devops-project1-512907/topics/cloud-builds'
