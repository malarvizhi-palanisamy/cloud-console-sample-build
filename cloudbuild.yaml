steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-build-repo/helloworld-image:v3'
      - '.'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-build-repo/helloworld-image:v3'

tags:
  - 'gcp-cloud-build-sample-build'

options:
  logging: CLOUD_LOGGING_ONLY
